name: Deploy landing (GHCR)

# Manual-only for now (workflow_dispatch), on purpose — this is Phase 1 of
# the GHCR migration (see the migration audit). Wiring this to `on: push`
# against main is a later, separate step once the test deployment in
# Coolify has been verified; until then nothing in this repo can trigger it
# automatically, and nothing here references the PRODUCTION Coolify app
# (l84c8cwc8og4gkswkgksoo80) — only GHCR and a to-be-created TEST app.
on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Build and push the image to GHCR"
        type: boolean
        default: true

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is sufficient to push to a package owned by this
          # repo's own org/account. A separate GHCR PAT is only needed if the
          # image must be pushed under a different GitHub account/org than
          # the one running this workflow.
          password: ${{ secrets.GITHUB_TOKEN }}

      # SENTRY_AUTH_TOKEN goes in as a BuildKit secret (never a build-arg or
      # env var) — see the Dockerfile's RUN --mount=type=secret step. It is
      # optional: if the secret isn't configured yet, the build still
      # succeeds and Sentry just skips the sourcemap upload (verified in
      # Phase 2).
      - name: Build and push image
        if: ${{ inputs.push_image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/muhammadarslan-dev/clearcut-turbo:${{ steps.meta.outputs.sha_tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_FRONTEND_URL=${{ vars.NEXT_PUBLIC_FRONTEND_URL }}
            NEXT_PUBLIC_FACEBOOK_PIXEL_ID=${{ vars.NEXT_PUBLIC_FACEBOOK_PIXEL_ID }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ vars.NEXT_PUBLIC_AMPLITUDE_API_KEY }}
            CMS_URL=${{ vars.CMS_URL }}
            ENVIRONMENT=production
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys to the TEST Coolify app only — this app does not exist yet
  # (created in a later phase of the migration). Left in place but inert:
  # with TEST_COOLIFY_APP_UUID unset, this job fails fast on a clear error
  # instead of silently doing nothing or guessing an app to deploy to. It
  # must never be pointed at the production uuid
  # (l84c8cwc8og4gkswkgksoo80) from this workflow.
  deploy-to-test:
    name: Deploy to test Coolify app
    needs: build-and-push
    if: ${{ inputs.push_image }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy (test app)
        run: |
          if [ -z "${{ vars.TEST_COOLIFY_APP_UUID }}" ]; then
            echo "::error::TEST_COOLIFY_APP_UUID is not set. Create the test Coolify app first, then set this repo variable before re-running this job." >&2
            exit 1
          fi
          curl -fsS -X GET \
            "${{ secrets.COOLIFY_BASE_URL }}/api/v1/deploy?uuid=${{ vars.TEST_COOLIFY_APP_UUID }}&tag=${{ needs.build-and-push.outputs.image_tag }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
