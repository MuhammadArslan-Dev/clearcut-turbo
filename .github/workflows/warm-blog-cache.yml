name: Warm blog cache

# Requests every sitemap URL once so visitors and crawlers get cached pages
# (a page rendered on its first request takes 2-10 s).
# MANUAL ONLY (2026-10-22): one full run writes ~3,300 pages to Vercel's ISR
# cache, ~100 write units each (~300K units), more than the Hobby plan's
# 200K/month. Run it only on a plan with room for that.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to warm"
        required: true
        default: "https://academy.clearcutoff.in"

concurrency:
  group: warm-blog-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/blog/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Warm every sitemap URL
        env:
          WARM_CONCURRENCY: "6"
        run: >
          node apps/blog/scripts/warm-cache.mjs
          "${{ inputs.base_url }}"
