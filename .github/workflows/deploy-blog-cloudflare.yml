name: Deploy blog to Cloudflare

# Manual for now — this deploys to the workers.dev test URL while blog is
# being verified on Cloudflare before the clearcutoff.in DNS cutover from
# Vercel. Once verified, add a `push: { branches: [main], paths: ["apps/blog/**"] }`
# trigger here for continuous deploys.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next build inlines every NEXT_PUBLIC_* var into the bundle right now —
      # there's no second chance to change these without rebuilding.
      - name: Build (Next.js + OpenNext Cloudflare bundle)
        working-directory: apps/blog
        env:
          BACKEND_URL: ${{ secrets.BLOG_BACKEND_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.BLOG_NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.BLOG_NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_CMS_URL: ${{ secrets.BLOG_NEXT_PUBLIC_CMS_URL }}
          NEXT_PUBLIC_FRONTEND_URL: ${{ secrets.BLOG_NEXT_PUBLIC_FRONTEND_URL }}
          NEXT_PUBLIC_PAYLOAD_URL: ${{ secrets.BLOG_NEXT_PUBLIC_PAYLOAD_URL }}
          NEXT_PUBLIC_PAYLOAD_MEDIA_URL: ${{ secrets.BLOG_NEXT_PUBLIC_PAYLOAD_MEDIA_URL }}
          NEXT_PUBLIC_AMPLITUDE_API_KEY: ${{ secrets.BLOG_NEXT_PUBLIC_AMPLITUDE_API_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.BLOG_NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.BLOG_NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_CLARITY_ID: ${{ secrets.BLOG_NEXT_PUBLIC_CLARITY_ID }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm run cf:build

      # BACKEND_URL is passed here (not baked into wrangler.jsonc) because
      # it's the one var this app reads from process.env per-request rather
      # than at build time — see the comment in wrangler.jsonc.
      - name: Deploy to Cloudflare Workers
        working-directory: apps/blog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler deploy
          --var BACKEND_URL:${{ secrets.BLOG_BACKEND_URL }}
