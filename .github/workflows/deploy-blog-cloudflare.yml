name: Deploy blog to Cloudflare

# Manual for now. academy.clearcutoff.in has been cut over from Vercel to
# this Worker (Custom Domain on clearcut-blog) — deploys still need a manual
# trigger here rather than `git push`. Add a
# `push: { branches: [main], paths: ["apps/blog/**"] }` trigger once that's
# wanted for continuous deploys.
#
# Cloudflare's own Git-integration (Workers Builds) would avoid this file
# entirely, but it requires the Administrator role on the Cloudflare
# account, which this account doesn't have — hence a plain CI workflow
# using a scoped API token instead.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # All 5 secrets were created as Environment secrets under "Production"
    # (not Repository secrets) — a job only sees those when it declares the
    # matching environment, otherwise `secrets.X` silently resolves to "".
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next build inlines every NEXT_PUBLIC_* var into the bundle right now —
      # there's no second chance to change these without rebuilding.
      - name: Build (Next.js + OpenNext Cloudflare bundle)
        working-directory: apps/blog
        env:
          BACKEND_URL: ${{ secrets.BLOG_BACKEND_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.BLOG_NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_PAYLOAD_URL: ${{ secrets.BLOG_NEXT_PUBLIC_PAYLOAD_URL }}
          # Not a secret (it's the public site origin). The blog's real
          # domain is academy.clearcutoff.in (a Custom Domain on the
          # clearcut-blog Worker, cut over from Vercel) — clearcutoff.in
          # root is a different site, so using it here would send the
          # Home breadcrumb/canonical URLs to the wrong domain.
          NEXT_PUBLIC_SITE_URL: "https://academy.clearcutoff.in"
        run: pnpm run cf:build

      # BACKEND_URL is passed here too (not just at build time) because it's
      # the one var this app reads from process.env per-request rather than
      # only at build time — see the comment in wrangler.jsonc.
      - name: Deploy to Cloudflare Workers
        working-directory: apps/blog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler deploy
          --var BACKEND_URL:${{ secrets.BLOG_BACKEND_URL }}
