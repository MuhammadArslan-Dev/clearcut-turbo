[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clearcut-analytics-mcp"
version = "0.1.0"
description = "Remote (OAuth) MCP server for Google Analytics 4: read + write, per-user Google roles. Vendors the tools of googleanalytics/google-analytics-mcp."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "google-analytics-data==0.23.3",
    "google-analytics-admin==0.30.2",
    "google-auth~=2.62",
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0,<3",
    "fastmcp>=4.0.6,<5",
]

[tool.setuptools.packages.find]
include = ["analytics_mcp*"]

[project.scripts]
analytics-mcp = "analytics_mcp.server:run_server"
