# Same public URL shapes as the Cloudflare Worker (apps/tools/worker/src/index.ts)
# + Pages deployment, served by one nginx:
#   /tools/*      -> out/*        /hi/tools/* -> out/hi/*      /mr/tools/* -> out/mr/*
# The Dockerfile lays /site out with symlinks so no rewrites are needed.
server {
    listen 80;
    server_name _;
    root /site;
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Worker: HTML/short TTL; hashed assets are immutable (overridden below).
    add_header Cache-Control "public, max-age=60, s-maxage=300, must-revalidate" always;

    error_page 404 /__404;
    location = /__404 {
        internal;
        alias /site/tools/404.html;
    }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }
    location = / { return 302 /tools; }

    # Bare locale roots have no page: one hop to the English index (Worker: LOCALE_TOOL_ROOTS).
    location ~ ^/(hi|mr)/tools/?$ { return 302 /tools$is_args$args; }

    # Trailing slash -> 301 to the slashless canonical (Worker: withoutTrailingSlash).
    location ~ ^(?<noslash>/(?:(?:hi|mr)/)?tools(?:/.*?)?)/+$ { return 301 $noslash$is_args$args; }

    # Bare /tools: the Worker's own index page, extracted at build time.
    location = /tools {
        alias /srv/tools-index.html;
        default_type text/html;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /sitemap-tools.xml {
        alias /site/tools/sitemap-index.xml;
        default_type application/xml;
    }

    location ^~ /tools/_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Syllabus Tracker client-only deep links (public/_redirects: 200 rewrite to the one built page).
    location ~ ^(?<pre>(?:/hi|/mr)?/tools)/syllabus-tracker/ {
        try_files $uri $uri.html $pre/syllabus-tracker.html;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
