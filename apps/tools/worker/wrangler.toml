name = "clearcut-tools-router"
main = "src/index.ts"
compatibility_date = "2026-08-11"

routes = [
	{ pattern = "clearcutoff.in/tools", zone_name = "clearcutoff.in" },
	# Broad catch-alls rather than one pattern per tool/asset type — this is
	# the second time a narrowly-scoped route list missed a real path
	# (first was /tools/_next/*, this time root-level static files like
	# favicon.ico/site.webmanifest, which live at "/tools/favicon.ico" per
	# next.config.ts's basePath but had no matching route here at all, so
	# Cloudflare never invoked this Worker for them and they 404'd against
	# the main site). matchPath() in src/index.ts already handles any path
	# under these prefixes generically, so route coverage should be equally
	# broad — a new tool, a new root asset, a new metadata route (e.g.
	# sitemap.xml) all work with zero wrangler.toml changes going forward.
	{ pattern = "clearcutoff.in/tools/*", zone_name = "clearcutoff.in" },
	{ pattern = "clearcutoff.in/hi/tools/*", zone_name = "clearcutoff.in" },
]

[vars]
PAGES_ORIGIN = "https://clearcut-tools.pages.dev"
